const FORM_NAME = 'Request Vehicle Window Tinting Permission';

const FLOW = ['start','name','contact','address','vehicle','vehicle-use','tint','check','confirmation'];

const PAGES = {

  'start': () => `
    <div class="space-y-8">
      <a href="#" class="inline-flex items-center gap-xs outline-none underline-offset-2 underline hover:no-underline active:bg-bb-yellow-100 focus-visible:bg-bb-yellow-100 text-bb-teal-00 hover:text-bb-black-00 hover:bg-bb-teal-10 mb-4">&#8592; Back</a>
      <h1 class="font-bold text-[3.5rem] leading-[1.15]">Request vehicle window tinting permission</h1>
      <p class="text-bb-mid-grey-00">Last updated 14 March 2026</p>
      <p>Use this service to request permission from the Barbados Licensing Authority to apply tinted film to the windows of your vehicle. All window tinting on vehicles registered in Barbados requires prior approval.</p>

      <div class="space-y-4">
        <h2 class="font-bold text-[1.5rem]">Tint level guidance</h2>
        <p>Window tint is measured by Visible Light Transmission (VLT) &mdash; the percentage of light that passes through the glass. A lower VLT percentage means a darker tint.</p>
        <p>To balance heat rejection with road safety, the following limits apply:</p>
        <ul class="list-disc pl-8 space-y-2">
          <li><strong>Front windshield:</strong> minimum 70% VLT (light tint only, to preserve driver visibility)</li>
          <li><strong>Front side windows:</strong> minimum 35% VLT (moderate tint allowed)</li>
          <li><strong>Rear side windows:</strong> minimum 20% VLT (darker tint permitted)</li>
          <li><strong>Rear window:</strong> minimum 20% VLT (darker tint permitted)</li>
        </ul>
        <p>Commercial vehicles and vehicles used for public transport may have different requirements assessed on a case-by-case basis. Requests for tint levels darker than the guidelines above will require additional justification.</p>
      </div>

      <div class="space-y-4">
        <h2 class="font-bold text-[1.5rem]">Fee</h2>
        <p>The application fee is <strong>BDS$50.00</strong>, payable upon submission.</p>
      </div>

      <div class="space-y-4">
        <h2 class="font-bold text-[1.5rem]">What you will need</h2>
        <ul class="list-disc pl-8 space-y-2">
          <li>Your full name and contact details</li>
          <li>Your current residential address</li>
          <li>Vehicle registration number and details (make, model, year)</li>
          <li>The VLT percentage you wish to apply to each window zone</li>
        </ul>
      </div>

      <div class="space-y-4">
        <h2 class="font-bold text-[1.5rem]">How to apply</h2>
        <p>Complete the online form below. You will need to provide your personal details, vehicle information, and the tint levels you are requesting.</p>
        ${GovBB.startBtn()}
      </div>
    </div>`,

  'name': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">What is your name?</h1>
      <div class="space-y-8">
        ${GovBB.textField('first-name', 'First name')}
        ${GovBB.textField('middle-name', 'Middle name(s) (optional)')}
        ${GovBB.textField('last-name', 'Last name')}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'contact': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">How can we contact you?</h1>
      <div class="space-y-8">
        ${GovBB.telField('mobile', 'Mobile phone number', { hint: 'For example, 230-4567' })}
        ${GovBB.emailField('email', 'Email address')}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'address': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">What is your address?</h1>
      <div class="space-y-8">
        ${GovBB.textField('street-address', 'Street address')}
        ${GovBB.selectField('parish', 'Parish', GovBB.PARISHES)}
        ${GovBB.textField('postal-code', 'Postal code', { hint: 'For example, BB11000', width: 'w-48' })}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'vehicle': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">What are your vehicle details?</h1>
      <div class="space-y-8">
        ${GovBB.textField('vehicle-make', 'Vehicle make', { hint: 'For example, Toyota' })}
        ${GovBB.textField('vehicle-model', 'Vehicle model', { hint: 'For example, Corolla' })}
        ${GovBB.textField('vehicle-year', 'Year of manufacture', { inputmode: 'numeric', maxlength: '4', width: 'w-36' })}
        ${GovBB.textField('registration-number', 'Vehicle registration number', { hint: 'The number shown on your vehicle\u2019s licence plate' })}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'vehicle-use': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Is the vehicle for personal or commercial use?</h1>
      <div class="space-y-8">
        ${GovBB.radioGroup('vehicle-use', '', ['Personal', 'Commercial'])}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'tint': () => `
    <form novalidate>
      ${GovBB.backLink()}
      ${GovBB.caption()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-4">What tint level are you requesting?</h1>
      <p class="text-[1.25rem] leading-normal text-bb-mid-grey-00 mb-8">Enter the Visible Light Transmission (VLT) percentage for each window zone. A lower number means a darker tint. Refer to the guidance limits: front windshield &ge;70%, front side &ge;35%, rear side and rear &ge;20%.</p>
      <div class="space-y-8">
        ${GovBB.textField('tint-front-windshield', 'Front windshield VLT %', { hint: 'Minimum 70%. For example, 75', inputmode: 'numeric', width: 'w-36' })}
        ${GovBB.textField('tint-front-side', 'Front side windows VLT %', { hint: 'Minimum 35%. For example, 40', inputmode: 'numeric', width: 'w-36' })}
        ${GovBB.textField('tint-rear-side', 'Rear side windows VLT %', { hint: 'Minimum 20%. For example, 25', inputmode: 'numeric', width: 'w-36' })}
        ${GovBB.textField('tint-rear-window', 'Rear window VLT %', { hint: 'Minimum 20%. For example, 25', inputmode: 'numeric', width: 'w-36' })}
        ${GovBB.continueBtn()}
      </div>
    </form>`,

  'check': () => {
    const D = GovBB.D;
    const fullName = [D['first-name'], D['middle-name'], D['last-name']].filter(Boolean).join(' ');
    const address = [D['street-address'], D['parish'], D['postal-code']].filter(Boolean).join(', ');
    const vehicle = [D['vehicle-year'], D['vehicle-make'], D['vehicle-model']].filter(Boolean).join(' ');
    const tintFw = D['tint-front-windshield'] ? D['tint-front-windshield'] + '% VLT' : '';
    const tintFs = D['tint-front-side'] ? D['tint-front-side'] + '% VLT' : '';
    const tintRs = D['tint-rear-side'] ? D['tint-rear-side'] + '% VLT' : '';
    const tintRw = D['tint-rear-window'] ? D['tint-rear-window'] + '% VLT' : '';
    return `
      ${GovBB.backLink()}
      <h1 class="font-bold text-[3.5rem] leading-[1.15] mb-8">Check your answers before sending your application</h1>

      <div class="space-y-8">
        <div>
          <h2 class="font-bold text-[1.5rem] mb-4">Personal details</h2>
          <dl class="divide-y divide-bb-grey-00 border-t border-bb-grey-00">
            ${GovBB.summaryRow('Name', fullName, 'name')}
            ${GovBB.summaryRow('Mobile phone', D['mobile'], 'contact')}
            ${GovBB.summaryRow('Email', D['email'], 'contact')}
            ${GovBB.summaryRow('Address', address, 'address')}
          </dl>
        </div>

        <div>
          <h2 class="font-bold text-[1.5rem] mb-4">Vehicle details</h2>
          <dl class="divide-y divide-bb-grey-00 border-t border-bb-grey-00">
            ${GovBB.summaryRow('Vehicle', vehicle, 'vehicle')}
            ${GovBB.summaryRow('Registration number', D['registration-number'], 'vehicle')}
            ${GovBB.summaryRow('Vehicle use', D['vehicle-use'], 'vehicle-use')}
          </dl>
        </div>

        <div>
          <h2 class="font-bold text-[1.5rem] mb-4">Requested tint levels</h2>
          <dl class="divide-y divide-bb-grey-00 border-t border-bb-grey-00">
            ${GovBB.summaryRow('Front windshield', tintFw, 'tint')}
            ${GovBB.summaryRow('Front side windows', tintFs, 'tint')}
            ${GovBB.summaryRow('Rear side windows', tintRs, 'tint')}
            ${GovBB.summaryRow('Rear window', tintRw, 'tint')}
          </dl>
        </div>

        <div>
          <h2 class="font-bold text-[1.5rem] mb-4">Fee</h2>
          <p>The application fee of <strong>BDS$50.00</strong> will be payable upon submission.</p>
        </div>

        <div>
          <h2 class="font-bold text-[1.5rem] mb-4">Declaration</h2>
          <p>By submitting this application, I confirm that the information I have provided is true and correct. I understand that providing false information may result in the refusal or revocation of my tinting permission.</p>
        </div>

        <div class="mt-8">
          ${GovBB.continueBtn('Submit application')}
        </div>
      </div>`;
  },

  'confirmation': () => {
    const D = GovBB.D;
    return `
    <div class="space-y-8">
      <div class="bg-bb-teal-00 text-bb-white-00 p-8 rounded-sm space-y-4">
        <h1 class="font-bold text-[3.5rem] leading-[1.15]">Application submitted</h1>
        <p class="text-[1.5rem]">Your reference number</p>
        <p class="text-[2rem] font-bold">${window.__refNumber || 'TINT-' + Math.random().toString(36).substring(2,8).toUpperCase()}</p>
        <p>We have sent a confirmation email to ${D['email'] || 'the address you provided'}.</p>
      </div>

      <div class="space-y-4">
        <h2 class="font-bold text-[1.5rem]">What happens next</h2>
        <p>The Barbados Licensing Authority will review your application. This typically takes 5 to 10 working days.</p>
        <p>If your requested tint levels are within the permitted guidelines, you will receive an approval letter with a tinting certificate to present to your installer.</p>
        <p>If your request exceeds the guidelines, you may be contacted for additional information or your application may be declined.</p>
      </div>

      <div class="space-y-4">
        <h2 class="font-bold text-[1.5rem]">Payment</h2>
        <p>The application fee of BDS$50.00 will be collected at the Licensing Authority office when you collect your tinting certificate.</p>
      </div>

      <div class="mt-8">
        <a href="#" onclick="location.reload();return false"
          class="${GovBB.LINK_CLS}">
          Return to start
        </a>
      </div>
    </div>`;
  }
};

/* ───────── Validation ───────── */
function validate(pageId) {
  const D = GovBB.D;
  const errors = [];

  function req(id, label) {
    if (!D[id] || !D[id].trim()) { errors.push({ id, msg: `${label} \u2013 Enter your ${label.toLowerCase()}` }); return false; }
    return true;
  }

  switch (pageId) {
    case 'name':
      req('first-name', 'First name');
      req('last-name', 'Last name');
      break;

    case 'contact':
      if (!D['mobile']?.trim()) {
        errors.push({ id: 'mobile', msg: 'Mobile phone number \u2013 Enter your mobile phone number' });
      }
      if (!D['email']?.trim()) {
        errors.push({ id: 'email', msg: 'Email address \u2013 Enter your email address' });
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(D['email'].trim())) {
        errors.push({ id: 'email', msg: 'Email address \u2013 Enter a valid email address' });
      }
      break;

    case 'address':
      req('street-address', 'Street address');
      req('parish', 'Parish');
      break;

    case 'vehicle':
      req('vehicle-make', 'Vehicle make');
      req('vehicle-model', 'Vehicle model');
      req('vehicle-year', 'Year of manufacture');
      req('registration-number', 'Vehicle registration number');
      break;

    case 'vehicle-use':
      if (!D['vehicle-use']) {
        errors.push({ id: 'vehicle-use-err', msg: 'Select whether the vehicle is for personal or commercial use' });
      }
      break;

    case 'tint':
      req('tint-front-windshield', 'Front windshield VLT %');
      req('tint-front-side', 'Front side windows VLT %');
      req('tint-rear-side', 'Rear side windows VLT %');
      req('tint-rear-window', 'Rear window VLT %');
      break;
  }

  return errors;
}

/* ───────── Init ───────── */
GovBB.init({
  formName: FORM_NAME,
  flow: FLOW,
  pages: PAGES,
  validate: validate,
});
</script>
</body>
</html>
